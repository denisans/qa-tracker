name: Validasi data QA
on:
  push:
    paths: ["data/**", "scripts/**", "dashboard/**"]
  pull_request:
    paths: ["data/**", "scripts/**", "dashboard/**"]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/qa.py validate
      - run: python scripts/qa.py dashboard
